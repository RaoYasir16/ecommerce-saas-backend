<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" fill="#ffffff" rx="16" />
  
  <!-- Outer Finder Pattern Top-Left -->
  <rect x="25" y="25" width="70" height="70" rx="8" fill="#1e1b4b" />
  <rect x="35" y="35" width="50" height="50" rx="4" fill="#ffffff" />
  <rect x="45" y="45" width="30" height="30" rx="4" fill="#4f46e5" />
  
  <!-- Outer Finder Pattern Top-Right -->
  <rect x="205" y="25" width="70" height="70" rx="8" fill="#1e1b4b" />
  <rect x="215" y="35" width="50" height="50" rx="4" fill="#ffffff" />
  <rect x="225" y="45" width="30" height="30" rx="4" fill="#4f46e5" />
  
  <!-- Outer Finder Pattern Bottom-Left -->
  <rect x="25" y="205" width="70" height="70" rx="8" fill="#1e1b4b" />
  <rect x="35" y="215" width="50" height="50" rx="4" fill="#ffffff" />
  <rect x="45" y="225" width="30" height="30" rx="4" fill="#4f46e5" />

  <!-- Alignment Pattern -->
  <rect x="210" y="210" width="40" height="40" rx="6" fill="#1e1b4b" />
  <rect x="218" y="218" width="24" height="24" rx="3" fill="#ffffff" />
  <rect x="224" y="224" width="12" height="12" rx="2" fill="#4f46e5" />

  <!-- Matrix Data Cells -->
  <!-- Row 1 -->
  <rect x="110" y="30" width="12" height="12" rx="2" fill="#312e81" />
  <rect x="130" y="30" width="12" height="12" rx="2" fill="#4338ca" />
  <rect x="160" y="30" width="12" height="12" rx="2" fill="#1e1b4b" />
  <rect x="180" y="30" width="12" height="12" rx="2" fill="#4f46e5" />

  <!-- Row 2 -->
  <rect x="110" y="50" width="12" height="12" rx="2" fill="#4f46e5" />
  <rect x="145" y="50" width="12" height="12" rx="2" fill="#312e81" />
  <rect x="175" y="50" width="12" height="12" rx="2" fill="#4338ca" />

  <!-- Row 3 -->
  <rect x="125" y="70" width="12" height="12" rx="2" fill="#1e1b4b" />
  <rect x="160" y="70" width="12" height="12" rx="2" fill="#4f46e5" />
  <rect x="180" y="70" width="12" height="12" rx="2" fill="#312e81" />

  <!-- Mid Columns -->
  <rect x="30" y="110" width="12" height="12" rx="2" fill="#312e81" />
  <rect x="50" y="110" width="12" height="12" rx="2" fill="#4f46e5" />
  <rect x="75" y="110" width="12" height="12" rx="2" fill="#1e1b4b" />
  <rect x="30" y="130" width="12" height="12" rx="2" fill="#4f46e5" />
  <rect x="65" y="130" width="12" height="12" rx="2" fill="#4338ca" />
  <rect x="45" y="150" width="12" height="12" rx="2" fill="#312e81" />
  <rect x="75" y="150" width="12" height="12" rx="2" fill="#4f46e5" />
  <rect x="30" y="170" width="12" height="12" rx="2" fill="#1e1b4b" />
  <rect x="60" y="170" width="12" height="12" rx="2" fill="#312e81" />

  <!-- Right Mid -->
  <rect x="210" y="110" width="12" height="12" rx="2" fill="#4338ca" />
  <rect x="235" y="110" width="12" height="12" rx="2" fill="#1e1b4b" />
  <rect x="260" y="110" width="12" height="12" rx="2" fill="#4f46e5" />
  <rect x="220" y="130" width="12" height="12" rx="2" fill="#312e81" />
  <rect x="245" y="130" width="12" height="12" rx="2" fill="#4338ca" />
  <rect x="205" y="155" width="12" height="12" rx="2" fill="#1e1b4b" />
  <rect x="230" y="155" width="12" height="12" rx="2" fill="#4f46e5" />
  <rect x="255" y="155" width="12" height="12" rx="2" fill="#312e81" />

  <!-- Bottom Mid -->
  <rect x="110" y="210" width="12" height="12" rx="2" fill="#4f46e5" />
  <rect x="135" y="210" width="12" height="12" rx="2" fill="#312e81" />
  <rect x="160" y="210" width="12" height="12" rx="2" fill="#4338ca" />
  <rect x="180" y="210" width="12" height="12" rx="2" fill="#1e1b4b" />
  <rect x="120" y="235" width="12" height="12" rx="2" fill="#1e1b4b" />
  <rect x="145" y="235" width="12" height="12" rx="2" fill="#4f46e5" />
  <rect x="175" y="235" width="12" height="12" rx="2" fill="#312e81" />
  <rect x="110" y="260" width="12" height="12" rx="2" fill="#4338ca" />
  <rect x="135" y="260" width="12" height="12" rx="2" fill="#1e1b4b" />
  <rect x="165" y="260" width="12" height="12" rx="2" fill="#4f46e5" />

  <!-- Center Branded Shield Logo -->
  <rect x="105" y="105" width="90" height="90" rx="14" fill="#ffffff" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.15))" />
  <rect x="112" y="112" width="76" height="76" rx="10" fill="#4f46e5" />
  
  <text x="150" y="148" font-family="Arial, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">RAAST</text>
  <text x="150" y="168" font-family="Arial, sans-serif" font-weight="700" font-size="10" fill="#c7d2fe" text-anchor="middle">INSTANT PAY</text>
</svg>
